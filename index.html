<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap para estilos rápidos y diseño responsive -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Bootstrap JS para componentes interactivos -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <title>Pagina web de Juan Pablo Aguero</title> <!-- Titulo de la pagina -->
</head>
<body class="container py-4">
    <!-- Título principal -->
    <h1 class="alert alert-info">Mi primer pagina web!</h1> <!-- Encabezado principal de la pagina -->
    <!-- Línea separadora visual -->
    <hr/>
    <!-- Párrafo introductorio con un span estilizado -->
    <p>Soy juanpy y acá probaré mis <span class="btn btn-primary">tecnologías web</span>.</p> <!-- Parrafo de texto -->
    <!-- Navegación a las páginas de práctica -->
    <p><a href="etiquetas-inline.html">Ir a la página de etiquetas inline</a></p>
    <p><a href="etiquetas-block.html">Ir a la página de etiquetas block</a></p>
    <p><a href="etiquetas-formularios.html">Ir a la página de etiquetas de formularios</a></p>
    <!-- Texto en movimiento (etiqueta clásica de ejemplo) -->
    <marquee>muy pronto habrá mas contenido</marquee> <!-- Texto en movimiento -->
    <!-- Imagen centrada en la página -->
    <center>
        <img class="img-thumbnail" src="img/imagen.jpg" width="300px" alt="Imagen de prueba"> <!-- Imagen de prueba -->
    </center>

    <!-- Enlace externo que abre Google en otra pestaña -->
    <a href="https://www.google.com" target="_blank">Ir a google!</a> <!-- Enlace externo -->

</body>
</html>
