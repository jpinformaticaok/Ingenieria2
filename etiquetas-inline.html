<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etiquetas inline</title>
</head>
<body class="p-4">
    <h1 class="alert alert-success">Ejemplos de etiquetas inline</h1>
    <p>
        <span>Esto es un texto con</span>
        <strong> negrita</strong>,
        <em> cursiva</em>,
        <u> subrayado</u>,
        <mark> resaltado</mark>,
        <small> texto pequeño</small>,
        <code> código</code>,
        <sup> superíndice</sup>
        y
        <sub> subíndice</sub>.
    </p>
    <p>
        También hay un
        <a href="https://developer.mozilla.org/es/docs/Web/HTML/Element/span" target="_blank" rel="noopener noreferrer">enlace externo</a>
        y una
        <abbr title="HyperText Markup Language">abreviatura</abbr>.
    </p>
    <p><a href="index.html">Volver al inicio</a></p>
</body>
</html>
