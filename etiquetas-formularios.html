<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap para estilos de formularios -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Etiquetas de formularios</title>
</head>
<body class="container py-4">
    <!-- Título y descripción de la práctica de formularios -->
    <h1 class="alert alert-info">Ejemplos de etiquetas de formularios</h1>
    <p>Esta página reúne distintas etiquetas y tipos de campos de formulario.</p>

    <!-- Formulario principal: action # evita envío real y method post simula envío de datos -->
    <form action="https://google.com/search" method="get" class="border rounded p-3 mb-4">
        <!-- Primer grupo de campos: datos básicos del usuario -->
        <fieldset class="mb-3">
            <legend>Datos personales</legend>

            <div class="mb-3">
                <!-- label vinculado al input por id/for -->
                <label for="q" class="form-label">Buscar algo en google</label>
                <!-- input text: campo de texto libre -->
                <input type="text" id="q" name="q" class="form-control" placeholder="Escribí tu busqueda" required>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Correo electrónico</label>
                <!-- input email: valida formato de correo -->
                <input type="email" id="email" name="email" class="form-control" placeholder="nombre@correo.com" required>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <!-- input password: oculta caracteres -->
                <input type="password" id="password" name="password" class="form-control">
            </div>

            <div class="mb-3">
                <label for="edad" class="form-label">Edad</label>
                <!-- input number: permite solo números dentro de un rango -->
                <input type="number" id="edad" name="edad" class="form-control" min="0" max="120">
            </div>

            <div class="mb-3">
                <label for="fecha" class="form-label">Fecha de nacimiento</label>
                <!-- input date: selector de fecha del navegador -->
                <input type="date" id="fecha" name="fecha" class="form-control">
            </div>
        </fieldset>

        <!-- Segundo grupo de campos: preferencias -->
        <fieldset class="mb-3">
            <legend>Preferencias</legend>

            <p class="mb-1">Lenguaje favorito:</p>
            <!-- radio: permite elegir una sola opción por compartir el mismo name -->
            <div class="form-check">
                <input type="radio" id="lang-html" name="lenguaje" value="html" class="form-check-input">
                <label for="lang-html" class="form-check-label">HTML</label>
            </div>
            <div class="form-check">
                <input type="radio" id="lang-css" name="lenguaje" value="css" class="form-check-input">
                <label for="lang-css" class="form-check-label">CSS</label>
            </div>
            <div class="form-check mb-3">
                <input type="radio" id="lang-js" name="lenguaje" value="js" class="form-check-input">
                <label for="lang-js" class="form-check-label">JavaScript</label>
            </div>

            <p class="mb-1">Temas de interés:</p>
            <!-- checkbox: permite múltiples selecciones -->
            <div class="form-check">
                <input type="checkbox" id="tema-web" name="temas" value="web" class="form-check-input">
                <label for="tema-web" class="form-check-label">Desarrollo web</label>
            </div>
            <div class="form-check">
                <input type="checkbox" id="tema-ui" name="temas" value="ui" class="form-check-input">
                <label for="tema-ui" class="form-check-label">Diseño UI</label>
            </div>
            <div class="form-check mb-3">
                <input type="checkbox" id="tema-bd" name="temas" value="bd" class="form-check-input">
                <label for="tema-bd" class="form-check-label">Bases de datos</label>
            </div>

            <div class="mb-3">
                <label for="pais" class="form-label">País</label>
                <!-- select + option: lista desplegable -->
                <select id="pais" name="pais" class="form-select">
                    <option value="">Selecciona una opción</option>
                    <option value="ar">Argentina</option>
                    <option value="uy">Uruguay</option>
                    <option value="cl">Chile</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="comentarios" class="form-label">Comentarios</label>
                <!-- textarea: texto largo multilínea -->
                <textarea id="comentarios" name="comentarios" class="form-control" rows="4" placeholder="Escribe tu mensaje"></textarea>
            </div>

            <div class="mb-3">
                <label for="navegador" class="form-label">Navegador preferido (datalist)</label>
                <!-- input list + datalist: sugerencias autocompletables -->
                <input list="lista-navegadores" id="navegador" name="navegador" class="form-control" placeholder="Ej: Chrome">
                <datalist id="lista-navegadores">
                    <option value="Chrome">
                    <option value="Firefox">
                    <option value="Edge">
                    <option value="Safari">
                </datalist>
            </div>
        </fieldset>

        <!-- Botones de acción del formulario -->
        <div class="d-flex gap-2">
            <!-- submit: envía el formulario -->
            <button type="submit" class="btn btn-primary">Enviar</button>
            <!-- reset: limpia los campos -->
            <button type="reset" class="btn btn-secondary">Limpiar</button>
        </div>
    </form>

    <!-- Enlace de regreso al index -->
    <p><a href="index.html">Volver al inicio</a></p>
</body>
</html>
